<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Veloura Chocolates AI Business Analytics Dashboard"
    >

    <title>
        {% block title %}
        Veloura Chocolates
        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>


<body>


    <!-- Main Content -->

    <main class="main-content">

        {% block content %}
        {% endblock %}

    </main>


    <!-- Footer -->

    <footer class="footer">

        <p>
            Veloura Chocolates · AI-powered business intelligence
        </p>

    </footer>

</body>

</html>
